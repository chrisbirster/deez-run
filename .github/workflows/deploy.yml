name: deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/deploy-now

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    name: verify and deploy to Fly.io
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm ci
      - run: npm run verify
      - name: Build production image
        run: docker build --build-arg TARGETARCH=amd64 -t deez-run:deploy-check .
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
