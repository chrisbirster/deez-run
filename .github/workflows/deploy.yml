name: deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    name: verify and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm install
      - run: npm run verify
      - name: Normalize Cloudflare credentials
        shell: bash
        env:
          RAW_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAW_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          normalize_secret() {
            local value="$1"
            value="${value//$'\r'/}"
            value="${value//$'\n'/}"
            value="${value#"${value%%[![:space:]]*}"}"
            value="${value%"${value##*[![:space:]]}"}"
            value="${value#CLOUDFLARE_API_TOKEN=}"
            value="${value#CLOUDFLARE_ACCOUNT_ID=}"
            value="${value#Bearer }"
            value="${value#bearer }"
            value="${value#\"}"
            value="${value%\"}"
            value="${value#\'}"
            value="${value%\'}"
            value="${value#"${value%%[![:space:]]*}"}"
            value="${value%"${value##*[![:space:]]}"}"
            printf '%s' "$value"
          }

          token="$(normalize_secret "$RAW_CLOUDFLARE_API_TOKEN")"
          account="$(normalize_secret "$RAW_CLOUDFLARE_ACCOUNT_ID")"

          if [[ -z "$token" || -z "$account" ]]; then
            echo "Cloudflare credentials are missing after normalization." >&2
            exit 1
          fi

          if [[ ! "$account" =~ ^[0-9a-fA-F]{32}$ ]]; then
            echo "CLOUDFLARE_ACCOUNT_ID must be a 32-character Cloudflare account ID." >&2
            exit 1
          fi

          if [[ "$token" =~ [[:space:]] ]]; then
            echo "CLOUDFLARE_API_TOKEN still contains whitespace after normalization." >&2
            exit 1
          fi

          echo "::add-mask::$token"
          echo "::add-mask::$account"
          printf 'CLOUDFLARE_API_TOKEN=%s\n' "$token" >> "$GITHUB_ENV"
          printf 'CLOUDFLARE_ACCOUNT_ID=%s\n' "$account" >> "$GITHUB_ENV"
      - name: Deploy Cloudflare Worker
        run: npx wrangler deploy
