name: Apply direct public nut install

on:
  push:
    branches:
      - feat/direct-public-nut-install
    paths:
      - .github/apply-direct-public-install-now

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch registry mirror and public nut UI
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          registry = Path('scripts/build-registry.mjs')
          text = registry.read_text()
          old = '''      const derived = parseNut(text);\n      versions.push({\n'''
          new = '''      const derived = parseNut(text);\n      if (!checkOnly) {\n        const mirrorDir = path.join(publicDir, "registry-nuts", entry.slug);\n        await mkdir(mirrorDir, { recursive: true });\n        await writeFile(path.join(mirrorDir, `${version.version}.nut`), bytes);\n      }\n      versions.push({\n'''
          if text.count(old) != 1:
              raise SystemExit(f'build-registry anchor count={text.count(old)}')
          registry.write_text(text.replace(old, new, 1))

          pages = Path('src/pages.tsx')
          text = pages.read_text()
          old = 'import { For, Show } from "solid-js";\n'
          new = 'import { For, Show, createSignal } from "solid-js";\n'
          if text.count(old) != 1:
              raise SystemExit(f'solid import anchor count={text.count(old)}')
          text = text.replace(old, new, 1)

          old = 'import { Seo } from "./seo";\n'
          new = 'import { Seo } from "./seo";\nimport { installCatalogNut } from "./publicNutInstall";\n'
          if text.count(old) != 1:
              raise SystemExit(f'Seo import anchor count={text.count(old)}')
          text = text.replace(old, new, 1)

          old = '''export function NutPage() {\n  const params = useParams();\n  const nut = () => findNut(String(params.slug ?? ""));\n\n  return (\n'''
          new = '''export function NutPage() {\n  const params = useParams();\n  const nut = () => findNut(String(params.slug ?? ""));\n  const [installing, setInstalling] = createSignal(false);\n  const [installError, setInstallError] = createSignal<string>();\n\n  async function addToMyDeez() {\n    const entry = nut();\n    if (!entry || installing()) return;\n    setInstalling(true);\n    setInstallError(undefined);\n    try {\n      const deck = await installCatalogNut(entry);\n      window.location.assign(`/app/decks/${encodeURIComponent(deck.id)}`);\n    } catch (reason) {\n      if (typeof reason === "object" && reason !== null && "status" in reason && (reason as { status?: number }).status === 401) {\n        window.location.assign(`/login?next=${encodeURIComponent(`/nuts/${entry.slug}`)}`);\n        return;\n      }\n      setInstallError(reason instanceof Error ? reason.message : "Unable to add this nut to My Deez.");\n    } finally {\n      setInstalling(false);\n    }\n  }\n\n  return (\n'''
          if text.count(old) != 1:
              raise SystemExit(f'NutPage anchor count={text.count(old)}')
          text = text.replace(old, new, 1)

          old = '''                <div {...stylex.attrs(styles.buttonRow)}>\n                  <a {...stylex.attrs(styles.button)} href={latest.raw_url}>Download .nut</a>\n                  <a {...stylex.attrs(styles.button, styles.buttonSecondary)} href={latest.source_url}>View source</a>\n                </div>\n'''
          new = '''                <div {...stylex.attrs(styles.buttonRow)}>\n                  <button {...stylex.attrs(styles.button)} type="button" disabled={installing()} onClick={() => void addToMyDeez()}>\n                    {installing() ? "Adding…" : "Add to My Deez"}\n                  </button>\n                  <a {...stylex.attrs(styles.button, styles.buttonSecondary)} href={latest.raw_url}>Download .nut</a>\n                  <a {...stylex.attrs(styles.button, styles.buttonSecondary)} href={latest.source_url}>View source</a>\n                </div>\n                <Show when={installError()}>{(value) => <p role="alert">{value()}</p>}</Show>\n'''
          if text.count(old) != 1:
              raise SystemExit(f'button anchor count={text.count(old)}')
          pages.write_text(text.replace(old, new, 1))
          PY
      - name: Verify
        run: npm ci && npm run verify
      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/build-registry.mjs src/pages.tsx src/publicNutInstall.ts
          git rm .github/workflows/apply-direct-public-install.yml .github/apply-direct-public-install-now
          git commit -m "Add direct public nut install path"
          git push origin HEAD:feat/direct-public-nut-install
