name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DEEZ_CORE_COMMIT: fd1d3c97ec6b90e0e8698555273f3cea8c7db5ae
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm ci
      - run: npm run verify
      - name: Verify SES relay infrastructure
        working-directory: infra
        run: |
          npm ci
          npm run check
      - name: Build production image against pinned Deez core
        run: docker build --build-arg TARGETARCH=amd64 --build-arg DEEZ_COMMIT="$DEEZ_CORE_COMMIT" -t deez-run:ci .
      - name: Verify production runtime contains only Deez server requirements
        run: |
          docker run --rm --entrypoint /bin/sh deez-run:ci -c 'test -x /app/deez && test -f /app/web/index.html && test -f /app/web/deez-scheduler.wasm && ! command -v node && ! command -v npm && ! command -v zig && ! command -v python3'
      - name: Execute compiled Zig scheduler WebAssembly
        shell: bash
        run: |
          set -euo pipefail
          container="$(docker create deez-run:ci)"
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          docker cp "$container:/app/web/deez-scheduler.wasm" /tmp/deez-scheduler.wasm
          node <<'JS'
          const fs = require('node:fs');
          (async () => {
            const { instance } = await WebAssembly.instantiate(fs.readFileSync('/tmp/deez-scheduler.wasm'), {});
            const e = instance.exports;
            for (const name of ['deez_reset','deez_validate_parameters','deez_append_review','deez_schedule','deez_due_at_ms','deez_interval_days']) {
              if (typeof e[name] !== 'function') throw new Error(`missing wasm export ${name}`);
            }
            e.deez_reset();
            if (e.deez_validate_parameters() !== 0) throw new Error('default FSRS parameters rejected');
            if (e.deez_schedule(1000n) !== 0) throw new Error('initial schedule failed');
            const firstDue = e.deez_due_at_ms(1);
            if (firstDue <= 1000n) throw new Error('Again did not schedule into the future');
            if (e.deez_append_review(1, 1000n) !== 0) throw new Error('review append failed');
            if (e.deez_schedule(firstDue) !== 0) throw new Error('second offline schedule failed');
            if (!Number.isFinite(e.deez_interval_days(3))) throw new Error('Good interval is not finite');
          })().catch((error) => { console.error(error); process.exit(1); });
          JS
      - name: Smoke-test Zig API, hosted auth boundary, PWA, and SPA serving
        shell: bash
        run: |
          set -euo pipefail
          docker network create deez-run-ci >/dev/null
          docker run -d --name deez-run-mongo --network deez-run-ci mongo:8 --replSet rs0 --bind_ip_all >/dev/null
          trap 'docker logs deez-run-smoke >/dev/null 2>&1 || true; docker logs deez-run-mongo || true; docker rm -f deez-run-smoke deez-run-mongo >/dev/null 2>&1 || true; docker network rm deez-run-ci >/dev/null 2>&1 || true' EXIT

          for _ in $(seq 1 60); do
            if docker exec deez-run-mongo mongosh --quiet --eval 'db.adminCommand({ping: 1}).ok' 2>/dev/null | grep -q '^1$'; then
              break
            fi
            sleep 1
          done
          docker exec deez-run-mongo mongosh --quiet --eval 'rs.initiate({_id: "rs0", members: [{_id: 0, host: "deez-run-mongo:27017"}]})' >/dev/null
          for _ in $(seq 1 60); do
            if docker exec deez-run-mongo mongosh --quiet --eval 'db.hello().isWritablePrimary' 2>/dev/null | grep -q '^true$'; then
              break
            fi
            sleep 1
          done
          docker exec deez-run-mongo mongosh --quiet --eval 'if (!db.hello().isWritablePrimary) quit(1)'

          docker run -d --name deez-run-smoke \
            --network deez-run-ci \
            -e DEEZ_STORAGE=mongodb \
            -e DEEZ_MONGO_URI='mongodb://deez-run-mongo:27017/deez_ci?replicaSet=rs0' \
            -e DEEZ_AUTH_BASE_URL='https://deez.run' \
            -e DEEZ_EMAIL_ENDPOINT='https://email-relay.invalid/send-magic-link' \
            -e DEEZ_EMAIL_RELAY_TOKEN='ci-not-used' \
            -p 18080:8080 \
            deez-run:ci

          for _ in $(seq 1 45); do
            if curl --fail --silent -D /tmp/health.headers http://127.0.0.1:18080/api/v1/health -o /tmp/health.json; then
              break
            fi
            sleep 1
          done

          grep -q '"status":"ok"' /tmp/health.json
          grep -qi '^content-security-policy: .*frame-ancestors '\''none'\''' /tmp/health.headers
          grep -qi '^cross-origin-opener-policy: same-origin' /tmp/health.headers
          grep -qi '^x-content-type-options: nosniff' /tmp/health.headers
          grep -qi '^x-frame-options: DENY' /tmp/health.headers

          private_status="$(curl --silent --output /tmp/private.json --write-out '%{http_code}' http://127.0.0.1:18080/api/v1/decks)"
          test "$private_status" = '401'
          grep -q 'authentication_required' /tmp/private.json

          curl --fail --silent http://127.0.0.1:18080/ > /tmp/index.html
          grep -q 'id="root"' /tmp/index.html
          curl --fail --silent -D /tmp/spa.headers http://127.0.0.1:18080/nuts -o /tmp/spa-fallback.html
          grep -q 'id="root"' /tmp/spa-fallback.html
          grep -qi '^content-security-policy: .*script-src '\''self'\''' /tmp/spa.headers
          grep -qi '^referrer-policy: no-referrer' /tmp/spa.headers

          curl --fail --silent http://127.0.0.1:18080/deez-scheduler.wasm -o /tmp/served-scheduler.wasm
          magic="$(od -An -tx1 -N4 /tmp/served-scheduler.wasm | tr -d ' \n')"
          test "$magic" = '0061736d'
          curl --fail --silent http://127.0.0.1:18080/sw.js | grep -q 'deez-scheduler.wasm'
