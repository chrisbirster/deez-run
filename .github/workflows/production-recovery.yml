name: production recovery

on:
  push:
    branches:
      - main
    paths:
      - .github/recover-now

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Restart wedged Fly machine
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl machine restart 28624e2a125218 -a deez-run
          sleep 5
          flyctl checks list -a deez-run
      - name: Verify public health
        run: |
          for i in 1 2 3 4 5 6; do
            if curl --connect-timeout 3 --max-time 5 -fsS https://deez.run/api/v1/health; then
              echo
              exit 0
            fi
            sleep 5
          done
          exit 1
